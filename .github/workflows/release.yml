name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "rjwt-py/pyproject.toml"

      - uses: dtolnay/rust-toolchain@stable

      - name: Run release pipeline
        run: python3 scripts/dev.py release --release

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: rjwt-wheel-${{ matrix.os }}
          path: target/wheels/*.whl
