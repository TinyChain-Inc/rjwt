name: Publish

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false

    runs-on: ${{ matrix.os }}

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "rjwt-py/pyproject.toml"

      - uses: dtolnay/rust-toolchain@stable

      - name: Build and verify release wheel
        run: python3 scripts/dev.py release --release

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: target/wheels/*.whl

  publish-wheel:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      id-token: write  # PyPI trusted publishing

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          repository-url: https://test.pypi.org/legacy/

  publish-docs:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      id-token: write  # GitHub Pages OIDC
      pages: write
      contents: read

    environment:
      name: github-pages
      url: ${{ steps.deploy-pages.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "rjwt-py/pyproject.toml"

      - uses: dtolnay/rust-toolchain@stable

      - name: Build module and documentation
        run: python3 scripts/dev.py ci --only stubs --only build --only docs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/docs/

      - id: deploy-pages
        uses: actions/deploy-pages@v4
