[package]
name = "rjwt"
version = "0.7.0"
edition = "2024"
authors = ["code@tinychain.net"]
description = "A recursive Javascript Web Token with support for ECDSA"
license = "Apache-2.0"
repository = "https://github.com/haydnv/rjwt.git"

keywords = ["jwt", "recursive", "oauth", "token", "scope"]
categories = ["authentication", "web-programming"]

[lib]
name = "rjwt_core"

[dependencies]
base64 = "0.22"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
futures = "0.3"
signature = "2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"

[dev-dependencies]
futures = "0.3"
