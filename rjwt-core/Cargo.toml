[package]
name = "rjwt"
version = "0.7.0"
edition = "2024"
authors = ["code@tinychain.net"]
description = "A recursive Javascript Web Token with support for ECDSA"
license = "Apache-2.0"
repository = "https://github.com/haydnv/rjwt.git"

keywords = ["jwt", "recursive", "oauth", "token", "scope"]
categories = ["authentication", "web-programming"]

[lib]
name = "rjwt_core"

[features]
default = ["falcon-rs"]
falcon-rs = ["falcon", "dep:falcon-rs"]
falcon = ["dep:zeroize"]

[dependencies]
base64 = "0.22"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
futures = "0.3"
signature = "2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
zeroize = { version = "1", optional = true, features = ["derive"] }
falcon-rs = { version = "0.2", optional = true }

[dev-dependencies]
futures = "0.3"

[[example]]
name = "ed25519"
path = "examples/ed25519.rs"

[[example]]
name = "falcon"
path = "examples/falcon.rs"
required-features = ["falcon-rs"]
